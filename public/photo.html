<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1a1205">
<title>光合作用 · 桌游对战</title>
<link rel="stylesheet" href="theme.css">
<style>
  /* ========== 阳光主题覆盖 ========== */
  :root {
    --sun-bg-deep: #0a0702;
    --sun-bg: #120d04;
    --sun-card: #1e1708;
    --sun-surface: #2a2109;
    --sun-border: #3d3016;
    --sun-border-bright: #5a4520;
    --sun-text: #f7eeda;
    --sun-text-dim: #b6a37a;
    --sun-main: #fbbf24;
    --sun-gold: #f59e0b;
    --sun-glow: rgba(251, 191, 36, 0.3);
    
    /* 土壤等级颜色 */
    --soil-4: #facc15;
    --soil-3: #a3e635;
    --soil-2: #4ade80;
    --soil-1: #22c55e;
  }
  
  body {
    background:
      radial-gradient(1200px 800px at 70% -12%, var(--sun-glow), transparent 68%),
      radial-gradient(900px 600px at 25% 112%, rgba(34, 197, 94, 0.12), transparent 68%),
      var(--sun-bg);
    color: var(--sun-text);
    user-select: none;
  }
  
  .wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 10px;
    gap: 10px;
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
  }
  
  /* ========== 卡片容器 ========== */
  .card {
    background: var(--sun-card);
    border: 1px solid var(--sun-border);
    border-radius: var(--radius-lg);
    padding: 12px;
    box-shadow: var(--shadow-md);
    backdrop-filter: blur(8px);
    transition: all var(--duration-base);
  }
  
  /* ========== 棋盘容器 ========== */
  #board {
    width: 100%;
    aspect-ratio: 1/1;
    display: block;
    touch-action: manipulation;
    border-radius: var(--radius-md);
    box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.2);
  }
  
  /* ========== 玩家信息丸 ========== */
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--sun-surface);
    border: 1px solid var(--sun-border-bright);
    border-radius: 99px;
    padding: 5px 12px;
    font-size: 12px;
    transition: all var(--duration-fast);
  }
  
  .pill:hover {
    background: var(--sun-card);
    border-color: var(--sun-main);
  }
  
  .pill b {
    color: var(--sun-main);
    font-weight: 900;
    text-shadow: 0 0 8px rgba(251, 191, 36, 0.3);
  }
  
  /* ========== 个人供应板 ========== */
  .supply {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  
  .sbtn {
    flex: 1;
    min-width: 68px;
    border-radius: var(--radius-md);
    padding: 10px 8px;
    text-align: center;
    background: var(--sun-surface);
    border: 2px solid var(--sun-border);
    cursor: pointer;
    font-size: 11px;
    transition: all var(--duration-base);
    position: relative;
    overflow: hidden;
  }
  
  .sbtn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent);
    opacity: 0;
    transition: opacity var(--duration-base);
  }
  
  .sbtn:hover {
    transform: translateY(-2px);
    background: var(--sun-card);
    border-color: var(--sun-border-bright);
  }
  
  .sbtn:hover::before {
    opacity: 1;
  }
  
  .sbtn.sel {
    border-color: var(--sun-main);
    background: rgba(251, 191, 36, 0.15);
    box-shadow: 
      0 0 0 3px rgba(251, 191, 36, 0.3),
      0 4px 16px rgba(251, 191, 36, 0.4);
    transform: translateY(-3px);
  }
  
  .sbtn b {
    display: block;
    font-size: 15px;
    font-weight: 900;
    color: var(--sun-main);
    margin-bottom: 4px;
  }
  
  .sbtn .st {
    color: var(--sun-text-dim);
    font-size: 10px;
    line-height: 1.3;
  }
  
  /* ========== 太阳标签 ========== */
  .sun-pill {
    position: absolute;
    top: 12px;
    right: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(251, 191, 36, 0.95);
    border: 2px solid rgba(251, 191, 36, 1);
    border-radius: 99px;
    padding: 5px 14px;
    font-size: 13px;
    font-weight: 800;
    color: #1a0e00;
    box-shadow: 
      0 4px 16px rgba(251, 191, 36, 0.5),
      inset 0 1px 0 rgba(255, 255, 255, 0.3);
    backdrop-filter: blur(8px);
  }
  
  /* ========== 按钮覆盖（阳光主题）========== */
  .btn-main,
  .btn-photo {
    background: linear-gradient(135deg, var(--sun-main), var(--sun-gold));
    color: #1a0e00;
    box-shadow: 0 4px 14px rgba(251, 191, 36, 0.4);
  }
  
  .btn-main:hover,
  .btn-photo:hover {
    box-shadow: 0 6px 20px rgba(251, 191, 36, 0.5);
    transform: translateY(-1px);
  }
  
  /* ========== 响应式优化 ========== */
  @media (max-width: 400px) {
    .sbtn {
      min-width: 62px;
      padding: 8px 6px;
    }
    
    .sbtn b {
      font-size: 14px;
    }
  }
  
  @media (min-width: 640px) {
    .wrap {
      padding: 16px;
      gap: 12px;
      max-width: 800px;
    }
    
    .card {
      padding: 16px;
    }
    
    .sbtn {
      min-width: 74px;
      padding: 12px 10px;
    }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="card">
    <div class="row between">
      <div>
        <div style="font-weight:800;font-size:16px">光合作用</div>
        <div class="sub">第 <span id="round">0</span>/<span id="total">18</span> 回合 · 第 <span id="rev">1</span>/3 圈</div>
      </div>
      <div style="text-align:right">
        <div style="font-weight:900;font-size:18px;color:var(--sun-main)" id="mylight">0 光点</div>
        <div class="sub" id="mytokens">标记 0 分</div>
      </div>
    </div>
    <div style="height:8px"></div>
    <div class="row" style="gap:6px;flex-wrap:wrap" id="players"></div>
  </div>

  <div class="card" style="padding:6px;position:relative">
    <canvas id="board"></canvas>
    <div class="sun-pill">
      <span id="sunlabel">太阳：北</span>
    </div>
  </div>

  <div class="card">
    <div class="sub" style="margin-bottom:8px;font-weight:600">我的个人板（从下往上买）</div>
    <div class="supply" id="supply"></div>
  </div>

  <div class="card">
    <div class="row" style="margin-bottom:8px">
      <span class="sub" id="selinfo" style="font-weight:600">点自己的树选中，再点目标格</span>
    </div>
    <div class="row">
      <button class="btn-photo" id="btn-grow" style="flex:1" disabled>长大</button>
      <button class="btn-photo" id="btn-plant" style="flex:1" disabled>种种子</button>
      <button class="btn-photo" id="btn-collect" style="flex:1" disabled>采标记(4)</button>
    </div>
    <div style="height:8px"></div>
    <div class="row">
      <button class="btn-ghost" id="btn-end" style="flex:1">结束我的回合</button>
    </div>
  </div>

</div>
<div class="toast" id="toast"></div>

<script src="shared.js"></script>
<script>
(() => {
  const { $, esc, toast, on, send, session } = App;

  const S = {
    state: null,
    sel: null,        // {q,r} 选中的自己的树
    buySize: null,    // 选中的购买尺寸
    canvas: null, ctx: null,
  };

  const SUN_NAMES = ['北', '东北', '东南', '南', '西南', '西北'];
  // 与引擎 SUN_DIRS 一致
  const SUN_DIRS = [
    { q: 0, r: -1 }, { q: 1, r: -1 }, { q: 1, r: 0 },
    { q: 0, r: 1 }, { q: -1, r: 1 }, { q: -1, r: 0 },
  ];

  const SIZE_NAME = { 0: '种子', 1: '小树', 2: '中树', 3: '大树' };
  const COLOR = ['#3b82f6', '#f59e0b', '#10b981', '#ef4444'];
  const SOIL = { 4: '#facc15', 3: '#a3e635', 2: '#4ade80', 1: '#22c55e' };

  // ---------- 六角几何 ----------
  function hexCenter(q, r, size, ox, oy) {
    const x = size * Math.sqrt(3) * (q + r / 2) + ox;
    const y = size * 1.5 * r + oy;
    return { x, y };
  }
  function hexPoints(cx, cy, size) {
    const pts = [];
    for (let i = 0; i < 6; i++) {
      const a = Math.PI / 180 * (60 * i - 30);
      pts.push([cx + size * Math.cos(a), cy + size * Math.sin(a)]);
    }
    return pts;
  }
  function pixelToHex(px, py, size, ox, oy) {
    // 暴力最近格（19 格，成本可忽略）
    let best = null, bd = Infinity;
    for (const st of S.state ? S.state.board : []) {
      const c = hexCenter(st.q, st.r, size, ox, oy);
      const d = (c.x - px) ** 2 + (c.y - py) ** 2;
      if (d < bd) { bd = d; best = st; }
    }
    return bd <= (size * 0.92) ** 2 ? best : null;
  }

  // ---------- 绘制 ----------
  function draw() {
    const cv = S.canvas, ctx = S.ctx;
    const st = S.state;
    if (!cv || !ctx) return;

    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = cv.clientWidth, h = cv.clientHeight;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
      cv.width = Math.round(w * dpr);
      cv.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    ctx.clearRect(0, 0, w, h);
    if (!st) return;

    const size = Math.min(w, h) / 7.4;
    const ox = w / 2, oy = h / 2;

    // 光从太阳方向来：画一条方向带
    const dir = SUN_DIRS[st.sunDir % 6];
    const dl = Math.hypot(dir.q, dir.r) || 1;
    const gx = ox + (dir.q / dl) * w * 0.55;
    const gy = oy + (dir.r / dl) * h * 0.55;
    const grad = ctx.createLinearGradient(gx, gy, ox, oy);
    grad.addColorStop(0, 'rgba(251,191,36,.28)');
    grad.addColorStop(1, 'rgba(251,191,36,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    // 太阳图标
    ctx.beginPath();
    ctx.arc(gx, gy, size * 0.6, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(251,191,36,.95)';
    ctx.shadowColor = 'rgba(251,191,36,.95)';
    ctx.shadowBlur = 28;
    ctx.fill();
    ctx.shadowBlur = 0;

    for (const cell of st.board) {
      const c = hexCenter(cell.q, cell.r, size, ox, oy);
      const pts = hexPoints(c.x, c.y, size * 0.92);

      ctx.beginPath();
      pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
      ctx.closePath();

      const lvl = cell.leaves || 0;
      if (lvl > 0) {
        const soilCol = SOIL[lvl] || '#4ade80';
        ctx.fillStyle = soilCol;
        ctx.globalAlpha = 0.3;
        ctx.fill();
        ctx.globalAlpha = 1;
      } else {
        ctx.fillStyle = 'rgba(42, 33, 9, 0.4)';
        ctx.fill();
      }

      ctx.strokeStyle = '#3d3016';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      if (cell.tree) {
        const owner = cell.tree.owner;
        const col = COLOR[owner % COLOR.length];
        const sz = cell.tree.size;

        ctx.beginPath();
        ctx.arc(c.x, c.y, size * (0.18 + sz * 0.14), 0, Math.PI * 2);
        ctx.fillStyle = col;
        ctx.shadowColor = col;
        ctx.shadowBlur = sz === 3 ? 18 : 10;
        ctx.fill();
        ctx.shadowBlur = 0;

        ctx.strokeStyle = 'rgba(255,255,255,.8)';
        ctx.lineWidth = 1.6;
        ctx.stroke();

        ctx.fillStyle = '#fff';
        ctx.font = `bold ${Math.round(size * 0.38)}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(String(sz), c.x, c.y);
      }

      // 选中高亮
      if (S.sel && S.sel.q === cell.q && S.sel.r === cell.r) {
        ctx.beginPath();
        pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
        ctx.closePath();
        ctx.strokeStyle = '#fbbf24';
        ctx.lineWidth = 3;
        ctx.shadowColor = '#fbbf24';
        ctx.shadowBlur = 12;
        ctx.stroke();
        ctx.shadowBlur = 0;
      }
    }
  }

  function shade(hex, k) {
    const n = parseInt(hex.slice(1), 16);
    const r = Math.round(((n >> 16) & 255) * k);
    const g = Math.round(((n >> 8) & 255) * k);
    const b = Math.round((n & 255) * k);
    return `rgb(${r},${g},${b})`;
  }

  // ---------- 渲染面板 ----------
  function render() {
    const st = S.state;
    if (!st) return;

    $('round').textContent = st.round;
    $('total').textContent = st.totalRounds;
    $('rev').textContent = Math.min(3, Math.floor(st.round / 6) + 1);
    $('sunlabel').textContent = '太阳：' + SUN_NAMES[st.sunDir % 6];

    const me = st.players[st.you != null ? st.you : 0];
    const myIdx = me ? me.index : 0;
    const mine = st.players[myIdx];
    if (mine) {
      $('mylight').textContent = mine.light + ' 光点';
      const tk = (mine.tokens || []).reduce((a, b) => a + b, 0);
      $('mytokens').textContent = `标记 ${tk} 分（${(mine.tokens || []).length} 枚）`;
    }

    $('players').innerHTML = st.players.map(p =>
      `<span class="pill"><i class="dot" style="background:${COLOR[p.index % COLOR.length]}"></i>
        ${esc(p.name)} · <b>${p.light}</b> · ${(p.tokens || []).reduce((a,b)=>a+b,0)}分
        ${st.currentPlayer === p.index ? ' ⏳' : ''}
      </span>`).join('');

    // 个人板
    const sizes = [3, 2, 1, 0];
    $('supply').innerHTML = sizes.map(sz =>
      `<div class="sbtn ${S.buySize === sz ? 'sel' : ''}" data-size="${sz}">
        <b>${SIZE_NAME[sz]}</b>
        <span class="st">库存 ${mine ? mine.supply[sz] : 0} · 花 ${[1,2,3,4][sz]} 点</span>
      </div>`).join('');

    [...document.querySelectorAll('.sbtn')].forEach(b => {
      b.onclick = () => {
        S.buySize = Number(b.dataset.size);
        render();
      };
    });

    updateButtons();
    draw();
  }

  function updateButtons() {
    const st = S.state;
    if (!st) return;
    const myTurn = st.currentPlayer === st.you && !st.ended;

    $('btn-grow').disabled = !myTurn || !S.sel;
    $('btn-plant').disabled = !myTurn || !S.sel;
    $('btn-collect').disabled = !myTurn || !S.sel;
    $('btn-end').disabled = !myTurn;

    if (S.sel) {
      const cell = st.board.find(c => c.q === S.sel.q && c.r === S.sel.r);
      if (cell && cell.tree) {
        $('selinfo').textContent = `已选：${SIZE_NAME[cell.tree.size]}（${cell.leaves} 叶土壤）`;
        $('btn-collect').disabled = !myTurn || cell.tree.size !== 3;
      }
    } else {
      $('selinfo').textContent = myTurn ? '点自己的树选中，再点目标格' : '等对手行动';
    }
  }

  // ---------- 点击棋盘 ----------
  function onBoardClick(ev) {
    const st = S.state;
    if (!st) return;
    const cv = S.canvas;
    const rect = cv.getBoundingClientRect();
    const px = (ev.clientX != null ? ev.clientX : ev.touches[0].clientX) - rect.left;
    const py = (ev.clientY != null ? ev.clientY : ev.touches[0].clientY) - rect.top;

    const size = Math.min(cv.clientWidth, cv.clientHeight) / 7.4;
    const cell = pixelToHex(px, py, size, cv.clientWidth / 2, cv.clientHeight / 2);
    if (!cell) return;

    const myTurn = st.currentPlayer === st.you;
    if (!myTurn) return toast('还没轮到你');

    // 点自己的树 → 选中
    if (cell.tree && cell.tree.owner === st.you) {
      S.sel = { q: cell.q, r: cell.r };
      render();
      return;
    }

    // 已选中树，点空格 → 种种子
    if (S.sel && !cell.tree) {
      send({ type: 'action', action: {
        kind: 'plant',
        fromQ: S.sel.q, fromR: S.sel.r,
        toQ: cell.q, toR: cell.r,
      }});
      S.sel = null;
      return;
    }

    // 点别人树/空格，仅切换选中
    S.sel = null;
    render();
  }

  // ---------- 动作 ----------
  $('btn-grow').onclick = () => {
    if (!S.sel) return;
    send({ type: 'action', action: { kind: 'grow', q: S.sel.q, r: S.sel.r } });
    S.sel = null;
  };
  $('btn-plant').onclick = () => toast('先点一个空格作为目标');
  $('btn-collect').onclick = () => {
    if (!S.sel) return;
    send({ type: 'action', action: { kind: 'collect', q: S.sel.q, r: S.sel.r } });
    S.sel = null;
  };
  $('btn-end').onclick = () => send({ type: 'action', action: { kind: 'endTurn' } });

  // 购买：点个人板尺寸
  document.addEventListener('click', e => {
    const b = e.target.closest && e.target.closest('.sbtn');
    if (!b) return;
    send({ type: 'action', action: { kind: 'buy', size: Number(b.dataset.size) } });
  });

  // ---------- 消息 ----------
  on('state', m => {
    if (m.game !== 'photo') return;
    S.state = m;
    if (m.you == null) {
      const me = m.players.find(p => p.name === App.session.name);
      m.you = me ? me.index : 0;
    }
    render();
  });

  on('gameover', m => {
    if (m.game !== 'photo') return;
    const lines = (m.ranking || []).map(r =>
      `${r.rank}. ${esc(r.name || ('玩家' + r.player))} — ${r.total} 分`).join('\n');
    alert('对局结束\n\n' + lines);
  });

  // 调试出口：便于自动化测试读取内部状态（不影响正常玩法）
  window.__S = S;
  window.__dbgPhoto = () => {
    const st = S.state;
    if (!st) return null;
    const myIdx = st.you != null ? st.you : 0;
    const me = st.players[myIdx];
    return {
      sunDir: st.sunDir,
      round: st.round,
      currentPlayer: st.currentPlayer,
      you: myIdx,
      light: me ? me.light : null,
      supply: me ? me.supply : null,
      trees: st.board.filter(c => c.tree).map(c => ({ q: c.q, r: c.r, owner: c.tree.owner, size: c.tree.size, leaves: c.leaves })),
      myTrees: st.board.filter(c => c.tree && c.tree.owner === myIdx).map(c => ({ q: c.q, r: c.r, size: c.tree.size })),
      emptyCells: st.board.filter(c => !c.tree).length,
    };
  };

  // ---------- 初始化 ----------
  window.addEventListener('load', () => {
    S.canvas = $('board');
    S.ctx = S.canvas.getContext('2d');
    S.canvas.addEventListener('click', onBoardClick);
    window.addEventListener('resize', () => draw());

    App.loadSession();
    if (!App.socket && App.session.code) {
      App.connect().then(() => {
        send({ type: 'hello', name: App.session.name, pid: App.session.pid, room: App.session.code });
      }).catch(() => {});
    }
    draw();
  });
})();
</script>
</body>
</html>
