<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0f1a">
<title>桌游对战 · 森林拼图 / 光合作用</title>
<style>
  /* ========== 品牌配色系统 v2.0 ========== */
  :root {
    --bg-deep: #0a0f1a; --bg-main: #0f1623; --bg-elevated: #1a2332; --surface: #162039; --surface-hover: #1e2a47;
    --border-subtle: #1e2a42; --border-normal: #2a3852; --border-strong: #3d4d6e;
    --text-primary: #f0f4fb; --text-secondary: #a8b5d1; --text-tertiary: #7086ab; --text-disabled: #4a5973;
    --forest-light: #d0f3e1; --forest: #22c55e; --forest-deep: #15803d; --forest-glow: rgba(34, 197, 94, 0.25);
    --sun-light: #fef3c7; --sun: #f59e0b; --sun-deep: #b45309; --sun-glow: rgba(245, 158, 11, 0.25);
    --success: #10b981; --error: #ef4444; --info: #3b82f6;
    --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.15); --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.2); --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.25); --shadow-xl: 0 12px 48px rgba(0, 0, 0, 0.3);
    --radius-sm: 10px; --radius-md: 14px; --radius-lg: 18px; --radius-xl: 24px;
    --duration-fast: 150ms; --duration-base: 250ms; --duration-slow: 350ms;
  }
  
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background:
      radial-gradient(1200px 800px at 15% -8%, var(--forest-glow), transparent 65%),
      radial-gradient(1000px 700px at 88% 108%, var(--sun-glow), transparent 65%),
      radial-gradient(800px 600px at 50% 50%, rgba(30, 42, 71, 0.4), transparent 80%),
      var(--bg-main);
    color: var(--text-primary);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; min-height: 100dvh;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  }
  
  .wrap { flex: 1; display: flex; flex-direction: column; padding: 20px 16px; gap: 18px; max-width: 580px; width: 100%; margin: 0 auto; }
  h1 { font-size: 28px; font-weight: 800; margin: 0; letter-spacing: -0.5px;
    background: linear-gradient(135deg, var(--text-primary), var(--text-secondary));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .sub { color: var(--text-secondary); font-size: 14px; margin: 0; line-height: 1.5; }
  label { display: block; font-size: 13px; font-weight: 600; color: var(--text-secondary); margin: 0 0 8px; letter-spacing: 0.3px; text-transform: uppercase; }
  
  .card { background: var(--bg-elevated); border: 1px solid var(--border-normal); border-radius: var(--radius-lg); padding: 20px;
    box-shadow: var(--shadow-md); backdrop-filter: blur(10px); transition: all var(--duration-base);
  }
  .card:hover { border-color: var(--border-strong); box-shadow: var(--shadow-lg); }
  
  input { width: 100%; padding: 14px 16px; border-radius: var(--radius-md); border: 1.5px solid var(--border-normal);
    background: var(--surface); color: var(--text-primary); font-size: 16px; outline: none; transition: all var(--duration-base);
  }
  input::placeholder { color: var(--text-tertiary); }
  input:hover { border-color: var(--border-strong); }
  input:focus { border-color: var(--forest); background: var(--bg-elevated); box-shadow: 0 0 0 3px var(--forest-glow); }
  
  button { width: 100%; padding: 15px 20px; border-radius: var(--radius-md); border: 0; font-size: 16px; font-weight: 700; cursor: pointer;
    transition: all var(--duration-base); position: relative; overflow: hidden;
  }
  button::before { content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent); opacity: 0; transition: opacity var(--duration-base);
  }
  button:hover::before { opacity: 1; }
  button:active { transform: scale(0.98); }
  button:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }
  
  .btn-forest { background: linear-gradient(135deg, var(--forest), var(--forest-deep)); color: #04140a; box-shadow: 0 4px 14px rgba(34, 197, 94, 0.3); }
  .btn-forest:hover { box-shadow: 0 6px 20px rgba(34, 197, 94, 0.4); transform: translateY(-1px); }
  .btn-photo { background: linear-gradient(135deg, var(--sun), var(--sun-deep)); color: #1a0e00; box-shadow: 0 4px 14px rgba(245, 158, 11, 0.3); }
  .btn-photo:hover { box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4); transform: translateY(-1px); }
  .btn-ghost { background: var(--surface); border: 1.5px solid var(--border-normal); color: var(--text-primary); }
  .btn-ghost:hover { background: var(--surface-hover); border-color: var(--border-strong); }
  
  /* ========== 大厅房间卡片 ========== */
  .lobby-card { background: var(--surface); border: 2px solid var(--border-normal); border-radius: var(--radius-md); padding: 14px;
    margin-bottom: 12px; transition: all var(--duration-base); cursor: pointer;
  }
  .lobby-card:hover { border-color: var(--border-strong); transform: translateY(-2px); box-shadow: var(--shadow-lg); }
  .lobby-card.forest { border-left: 4px solid var(--forest); }
  .lobby-card.photo { border-left: 4px solid var(--sun); }
  .lobby-game { font-weight: 800; font-size: 16px; margin-bottom: 6px; }
  .lobby-game.forest { color: var(--forest); }
  .lobby-game.photo { color: var(--sun); }
  .lobby-host { font-size: 14px; color: var(--text-secondary); margin-bottom: 4px; }
  .lobby-status { font-size: 13px; color: var(--text-tertiary); margin-bottom: 10px; }
  .lobby-card button { margin-top: 8px; padding: 10px 14px; font-size: 14px; }
  .lobby-empty { text-align: center; padding: 40px 20px; color: var(--text-tertiary); }
  
  .code { font-family: ui-monospace, "SF Mono", Menlo, Monaco, "Cascadia Code", monospace; font-size: 42px; letter-spacing: 12px; font-weight: 900;
    background: linear-gradient(135deg, #7dd3fc, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    text-align: center; text-shadow: 0 0 24px rgba(59, 130, 246, 0.3);
  }
  
  .plist { display: flex; flex-direction: column; gap: 0; }
  .prow { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border-subtle); transition: background var(--duration-fast); }
  .prow:last-child { border-bottom: 0; }
  .prow:hover { background: var(--surface); margin: 0 -8px; padding-left: 8px; padding-right: 8px; border-radius: var(--radius-sm); }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 10px; vertical-align: -1px; box-shadow: 0 0 8px currentColor; }
  .badge { font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 99px; background: var(--surface); border: 1px solid var(--border-normal); letter-spacing: 0.3px; }
  
  .toast { position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%) translateY(16px); background: var(--bg-elevated);
    border: 1px solid var(--border-strong); padding: 12px 22px; border-radius: var(--radius-md); font-size: 14px; opacity: 0;
    pointer-events: none; transition: all var(--duration-base); z-index: 999; max-width: 88vw; text-align: center;
    box-shadow: var(--shadow-xl); backdrop-filter: blur(12px);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  
  .row { display: flex; gap: 12px; }
  .row > * { flex: 1; }
  .hide { display: none !important; }
  
  @media (max-width: 400px) { h1 { font-size: 24px; } .code { font-size: 36px; letter-spacing: 8px; } }
  @media (min-width: 640px) { .wrap { padding: 32px 24px; gap: 20px; } h1 { font-size: 32px; } .card { padding: 24px; } }
</style>
</head>
<body>
<div class="wrap">

  <!-- 主页：大厅 -->
  <section id="v-lobby">
    <h1>桌游对战</h1>
    <p class="sub">和朋友实时开一局，手机浏览器直接玩</p>

    <div class="card" style="margin-top:14px">
      <label>你的名字</label>
      <input id="nm" maxlength="14" placeholder="随便起一个" autocomplete="off" enterkeyhint="go">
    </div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
        <span style="font-weight:700;font-size:15px">🎮 公开大厅</span>
        <span class="sub" id="lobby-count">0 个房间</span>
      </div>
      <div id="lobby-list"></div>
    </div>

    <button class="btn-forest" id="btn-create-main">+ 创建新房间</button>
    <button class="btn-ghost" id="btn-code-join">🔒 用房间码加入</button>
  </section>

  <!-- 创建房间选项 -->
  <section id="v-create" class="hide">
    <h1>创建房间</h1>
    <div class="card" style="margin-top:14px">
      <label>选择游戏</label>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <button class="btn-forest" id="btn-forest" style="padding:16px 12px">
          <div style="font-size:18px;margin-bottom:4px">🌲</div>
          <div style="font-size:14px">森林拼图</div>
          <div style="font-size:11px;opacity:0.7;margin-top:4px">2-5 人</div>
        </button>
        <button class="btn-photo" id="btn-photo" style="padding:16px 12px">
          <div style="font-size:18px;margin-bottom:4px">☀️</div>
          <div style="font-size:14px">光合作用</div>
          <div style="font-size:11px;opacity:0.7;margin-top:4px">2-4 人</div>
        </button>
      </div>
    </div>
    <button class="btn-ghost" id="btn-back">← 返回大厅</button>
  </section>

  <!-- 房间等待 -->
  <section id="v-room" class="hide">
    <button class="btn-ghost" id="btn-leave" style="margin-bottom:12px">← 离开房间</button>
    <div class="card">
      <div class="sub" id="room-game" style="text-align:center;margin-bottom:6px"></div>
      <div class="code" id="room-code">----</div>
      <p class="sub" style="text-align:center;margin:8px 0 14px">把链接发给朋友，他们点开就能进</p>
      <button class="btn-ghost" id="btn-share">复制邀请链接</button>
    </div>
    <div class="card">
      <div class="sub" style="margin-bottom:8px"><span id="room-count">0/0</span> 人已入座</div>
      <div class="plist" id="players"></div>
    </div>
    <button class="btn-forest" id="btn-start">开始游戏</button>
    <p class="sub" id="wait-hint" style="text-align:center"></p>
  </section>

</div>
<div class="toast" id="toast"></div>

<script src="shared.js"></script>
<script>
(() => {
  const { $, esc, toast, on, enter, inviteLink, copyText, session } = App;

  let lobbyRooms = [];
  let roomState = null;

  // ---------- 大厅 ----------
  function showView(view) {
    ['v-lobby', 'v-create', 'v-room'].forEach(v => $(v).classList.toggle('hide', v !== view));
  }

  function renderLobby() {
    $('lobby-count').textContent = lobbyRooms.length + ' 个房间';
    if (lobbyRooms.length === 0) {
      $('lobby-list').innerHTML = '<div class="lobby-empty">暂无公开房间<br>创建一个开始游戏吧！</div>';
      return;
    }

    $('lobby-list').innerHTML = lobbyRooms.map(r => {
      const gameClass = r.game === 'forest' ? 'forest' : 'photo';
      const gameIcon = r.game === 'forest' ? '🌲' : '☀️';
      const statusText = r.phase === 'lobby' ? '等待中' : '游戏中 🔴';
      const canJoin = r.phase === 'lobby' && r.playerCount < r.maxPlayers;
      
      return `<div class="lobby-card ${gameClass}" data-code="${r.code}">
        <div class="lobby-game ${gameClass}">${gameIcon} ${r.gameName}</div>
        <div class="lobby-host">房主：${esc(r.hostName)}</div>
        <div class="lobby-status">${r.playerCount}/${r.maxPlayers} 人 · ${statusText}</div>
        <button class="btn-${gameClass}" ${canJoin ? '' : 'disabled'}>
          ${canJoin ? '快速加入 →' : '游戏中'}
        </button>
      </div>`;
    }).join('');

    // 绑定加入事件
    [...document.querySelectorAll('.lobby-card button')].forEach(btn => {
      const card = btn.closest('.lobby-card');
      if (!card) return;
      const code = card.dataset.code;
      btn.onclick = () => joinRoom(code);
    });
  }

  async function joinRoom(code) {
    const name = $('nm').value.trim();
    if (!name) { toast('先填名字'); $('nm').focus(); return; }
    await enter({ name, room: code });
  }

  // 请求大厅列表
  function requestLobby() {
    if (App.socket && App.socket.readyState === 1) {
      App.send({ type: 'getLobby' });
    }
  }

  // 监听大厅更新
  on('lobby', m => {
    lobbyRooms = m.rooms || [];
    renderLobby();
  });

  $('btn-create-main').onclick = () => showView('v-create');
  $('btn-code-join').onclick = () => {
    const code = prompt('输入房间码（4 位）：');
    if (code) joinRoom(code.toUpperCase());
  };
  $('btn-back').onclick = () => showView('v-lobby');

  $('btn-forest').onclick = async () => {
    const name = $('nm').value.trim();
    if (!name) { toast('先填名字'); $('nm').focus(); return; }
    await enter({ name, game: 'forest', isPublic: true });
  };

  $('btn-photo').onclick = async () => {
    const name = $('nm').value.trim();
    if (!name) { toast('先填名字'); $('nm').focus(); return; }
    await enter({ name, game: 'photo', isPublic: true });
  };

  // ---------- 房间视图 ----------
  on('joined', () => showView('v-room'));
  on('restored', () => showView('v-room'));

  on('room', m => {
    roomState = m;
    $('room-code').textContent = m.code;
    $('room-game').textContent = m.gameName;
    $('room-count').textContent = m.players.length + '/' + m.max;
    $('players').innerHTML = m.players.map(p =>
      `<div class="prow">
        <span><i class="dot" style="background:${p.color}"></i>${esc(p.name)}${p.isHost ? ' <span class="badge">房主</span>' : ''}${p.id === session.pid ? ' <span class="badge">你</span>' : ''}</span>
        <span class="sub">${p.connected ? '在线' : '掉线'}</span>
      </div>`).join('');

    // 修复：通过 players 数组中的 isHost 判断，更可靠
    const me = m.players.find(p => p.id === session.pid);
    const isHost = me ? me.isHost : false;
    
    console.log('[DEBUG] Room state:', { 
      myPid: session.pid, 
      hostId: m.hostId, 
      isHost, 
      playerCount: m.players.length 
    });
    
    $('btn-start').style.display = isHost ? '' : 'none';
    $('btn-start').className = m.game === 'forest' ? 'btn-forest' : 'btn-photo';
    $('btn-start').textContent = m.game === 'forest' ? '开始森林拼图' : '开始光合作用';
    $('btn-start').disabled = m.players.length < 2;
    $('wait-hint').textContent = isHost
      ? (m.players.length < 2 ? '至少还要 1 个人' : '人都到齐就开')
      : '等房主开始';
    showView('v-room');
  });

  $('btn-start').onclick = () => App.send({ type: 'start' });

  $('btn-leave').onclick = () => {
    if (confirm('确定要离开房间吗？')) {
      App.clearSession();
      location.reload();
    }
  };

  on('state', m => {
    const target = m.game === 'forest' ? 'forest.html' : 'photo.html';
    if (location.pathname.endsWith(target)) return;
    location.href = target + (location.search || '');
  });

  $('btn-share').onclick = async () => {
    if (!roomState) return;
    const url = inviteLink(roomState.code);
    const ok = await copyText(url);
    if (ok) toast('链接已复制，发群里');
    else prompt('复制这个链接发给朋友：', url);
  };

  // 自动恢复会话（刷新后重连）
  App.loadSession();
  
  // 恢复名字到输入框
  if (session.name) {
    $('nm').value = session.name;
  }
  
  if (session.code && session.pid) {
    // 如果有会话，自动重连到房间
    App.connect().then(() => {
      App.send({ type: 'hello', name: session.name, pid: session.pid, room: session.code });
    }).catch(() => {});
  } else {
    // 没有会话，请求大厅列表
    App.connect().then(() => {
      requestLobby();
      // 每 10 秒刷新一次大厅
      setInterval(requestLobby, 10000);
    }).catch(() => {});
  }

  // 如果链接带 ?room=，直接加入
  const p = new URLSearchParams(location.search);
  if (p.get('room')) {
    const code = p.get('room').toUpperCase();
    setTimeout(() => {
      if ($('nm').value.trim()) joinRoom(code);
      else { $('nm').focus(); toast('填名字后自动加入 ' + code); }
    }, 500);
  }
})();
</script>
</body>
</html>
