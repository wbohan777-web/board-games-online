<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0f1a">
<title>登录 · 桌游对战</title>
<link rel="stylesheet" href="theme.css">
<style>
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  
  .login-container {
    max-width: 420px;
    width: 100%;
  }
  
  .card {
    background: var(--bg-elevated);
    border: 1px solid var(--border-normal);
    border-radius: var(--radius-lg);
    padding: 32px;
    box-shadow: var(--shadow-xl);
  }
  
  h1 {
    font-size: 28px;
    font-weight: 800;
    margin: 0 0 8px;
    text-align: center;
  }
  
  .subtitle {
    text-align: center;
    color: var(--text-secondary);
    font-size: 14px;
    margin: 0 0 32px;
  }
  
  .form-group {
    margin-bottom: 20px;
  }
  
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 8px;
  }
  
  input {
    width: 100%;
    padding: 14px 16px;
    border-radius: var(--radius-md);
    border: 1.5px solid var(--border-normal);
    background: var(--surface);
    color: var(--text-primary);
    font-size: 16px;
    outline: none;
    transition: all var(--duration-base);
  }
  
  input:focus {
    border-color: var(--forest);
    background: var(--bg-elevated);
    box-shadow: 0 0 0 3px var(--forest-glow);
  }
  
  .btn {
    width: 100%;
    padding: 15px 20px;
    border-radius: var(--radius-md);
    border: 0;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all var(--duration-base);
    margin-bottom: 12px;
  }
  
  .btn-primary {
    background: linear-gradient(135deg, var(--forest), var(--forest-deep));
    color: #04140a;
    box-shadow: 0 4px 14px rgba(34, 197, 94, 0.3);
  }
  
  .btn-primary:hover {
    box-shadow: 0 6px 20px rgba(34, 197, 94, 0.4);
    transform: translateY(-1px);
  }
  
  .btn-secondary {
    background: var(--surface);
    border: 1.5px solid var(--border-normal);
    color: var(--text-primary);
  }
  
  .btn-secondary:hover {
    background: var(--surface-hover);
    border-color: var(--border-strong);
  }
  
  .error {
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid var(--error);
    color: #fca5a5;
    padding: 12px 16px;
    border-radius: var(--radius-md);
    font-size: 14px;
    margin-bottom: 20px;
    display: none;
  }
  
  .error.show {
    display: block;
  }
  
  .divider {
    text-align: center;
    margin: 24px 0;
    color: var(--text-tertiary);
    font-size: 13px;
    position: relative;
  }
  
  .divider::before,
  .divider::after {
    content: '';
    position: absolute;
    top: 50%;
    width: calc(50% - 30px);
    height: 1px;
    background: var(--border-subtle);
  }
  
  .divider::before { left: 0; }
  .divider::after { right: 0; }
  
  .loading {
    opacity: 0.6;
    pointer-events: none;
  }
</style>
</head>
<body>
<div class="login-container">
  <div class="card">
    <h1>桌游对战</h1>
    <p class="subtitle">登录开始游戏</p>
    
    <div class="error" id="error"></div>
    
    <!-- 登录表单 -->
    <form id="login-form">
      <div class="form-group">
        <label>用户名</label>
        <input type="text" id="login-username" placeholder="请输入用户名" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="login-password" placeholder="请输入密码" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary">登录</button>
    </form>
    
    <div class="divider">或</div>
    
    <button class="btn btn-secondary" id="show-register">注册新账号</button>
  </div>
  
  <!-- 注册表单（隐藏） -->
  <div class="card" id="register-card" style="display:none;margin-top:20px">
    <h1>注册账号</h1>
    <p class="subtitle">加入桌游对战</p>
    
    <form id="register-form">
      <div class="form-group">
        <label>用户名</label>
        <input type="text" id="reg-username" placeholder="3-20 个字符" autocomplete="username" required minlength="3" maxlength="20">
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="reg-password" placeholder="至少 6 个字符" autocomplete="new-password" required minlength="6">
      </div>
      <div class="form-group">
        <label>显示名称（可选）</label>
        <input type="text" id="reg-displayname" placeholder="游戏中显示的名字" maxlength="14">
      </div>
      <button type="submit" class="btn btn-primary">注册并登录</button>
      <button type="button" class="btn btn-secondary" id="show-login">返回登录</button>
    </form>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const API = location.origin;
  
  async function request(path, data) {
    const res = await fetch(API + path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data),
    });
    return await res.json();
  }
  
  function showError(msg) {
    $('error').textContent = msg;
    $('error').classList.add('show');
    setTimeout(() => $('error').classList.remove('show'), 5000);
  }
  
  function setLoading(loading) {
    document.body.classList.toggle('loading', loading);
  }
  
  // 登录
  $('login-form').onsubmit = async (e) => {
    e.preventDefault();
    setLoading(true);
    
    try {
      const result = await request('/api/auth/login', {
        username: $('login-username').value.trim(),
        password: $('login-password').value,
      });
      
      if (result.ok) {
        localStorage.setItem('token', result.token);
        localStorage.setItem('user', JSON.stringify(result.user));
        location.href = '/';
      } else {
        showError(result.error || '登录失败');
      }
    } catch (err) {
      showError('网络错误：' + err.message);
    } finally {
      setLoading(false);
    }
  };
  
  // 注册
  $('register-form').onsubmit = async (e) => {
    e.preventDefault();
    setLoading(true);
    
    try {
      const result = await request('/api/auth/register', {
        username: $('reg-username').value.trim(),
        password: $('reg-password').value,
        displayName: $('reg-displayname').value.trim() || $('reg-username').value.trim(),
      });
      
      if (result.ok) {
        localStorage.setItem('token', result.token);
        localStorage.setItem('user', JSON.stringify(result.user));
        location.href = '/';
      } else {
        showError(result.error || '注册失败');
      }
    } catch (err) {
      showError('网络错误：' + err.message);
    } finally {
      setLoading(false);
    }
  };
  
  // 切换表单
  $('show-register').onclick = () => {
    $('register-card').style.display = 'block';
    $('show-register').style.display = 'none';
  };
  
  $('show-login').onclick = () => {
    $('register-card').style.display = 'none';
    $('show-register').style.display = '';
  };
  
  // 如果已登录，直接跳转
  const token = localStorage.getItem('token');
  if (token) {
    fetch(API + '/api/auth/me', {
      headers: { 'Authorization': 'Bearer ' + token }
    }).then(r => r.json()).then(result => {
      if (result.ok) {
        location.href = '/';
      }
    });
  }
})();
</script>
</body>
</html>
