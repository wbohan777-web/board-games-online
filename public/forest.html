<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#06140c">
<title>森林拼图</title>
<style>
  :root{
    --bg:#06140c; --card:#0d2118; --line:#1d3d2c; --text:#e6f5ec; --dim:#8fb3a1;
    --leaf:#22c55e; --gold:#fbbf24; --warn:#f87171;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{height:100%}
  body{
    margin:0;color:var(--text);
    background:radial-gradient(900px 600px at 30% -10%, rgba(34,197,94,.14), transparent 60%), var(--bg);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;
    display:flex;flex-direction:column;min-height:100dvh;
  }
  .wrap{flex:1;display:flex;flex-direction:column;padding:10px;gap:8px;max-width:760px;width:100%;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}
  .row{display:flex;gap:8px;align-items:center}
  .between{justify-content:space-between}
  .sub{color:var(--dim);font-size:12px}
  .hide{display:none!important}
  button{border:0;border-radius:10px;padding:10px 14px;font-size:14px;font-weight:700;cursor:pointer;background:#1a3d2b;color:var(--text)}
  button:active{transform:scale(.97)}
  button:disabled{opacity:.4}
  .btn-main{background:linear-gradient(135deg,#22c55e,#15803d);color:#04140a}
  .btn-warn{background:#7f1d1d;color:#ffd9d9}
  .btn-ghost{background:transparent;border:1px solid var(--line)}

  /* 对手条 */
  .opps{display:flex;gap:6px;flex-wrap:wrap}
  .opp{background:#0a1c13;border:1px solid var(--line);border-radius:10px;padding:5px 9px;font-size:12px}
  .opp b{color:var(--gold)}

  /* 森林：树的四槽 */
  .forest{display:flex;gap:10px;overflow-x:auto;padding:4px 0}
  .tree{
    flex:0 0 auto;display:grid;grid-template-columns:34px 62px 34px;
    grid-template-rows:34px 62px 34px;gap:3px;
  }
  .slot{
    border:1.5px dashed #2b5540;border-radius:8px;display:flex;align-items:center;
    justify-content:center;font-size:9px;color:var(--dim);overflow:hidden;text-align:center;
    padding:2px;line-height:1.1;cursor:pointer;
  }
  .slot.filled{border-style:solid;border-color:#3f7d5c;background:#123322;color:#c7f0d8;font-size:9px}
  .slot.target{border-color:var(--gold);box-shadow:0 0 0 2px rgba(251,191,36,.25)}
  .trunk{
    border-radius:10px;display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:800;background:linear-gradient(150deg,#2f7a4e,#164a2c);
    border:1.5px solid #4b9c6c;color:#eafff2;text-align:center;padding:4px;
  }
  .trunk.sapling{background:linear-gradient(150deg,#3d6b4c,#1c3a26);border-color:#3d6b4c;font-size:10px}

  /* 手牌 */
  .hand{display:flex;gap:6px;overflow-x:auto;padding:6px 2px}
  .hc{
    flex:0 0 auto;width:76px;height:104px;border-radius:10px;border:1.5px solid #2b5540;
    background:linear-gradient(160deg,#14311f,#0b1f14);padding:5px;font-size:9px;
    display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;
    transition:.12s;position:relative;
  }
  .hc.tree{border-color:#4b9c6c;background:linear-gradient(160deg,#1b4d2e,#0d2617)}
  .hc.split{border-color:#3f7d5c}
  .hc.sel{border-color:var(--gold);box-shadow:0 0 0 2px rgba(251,191,36,.3);transform:translateY(-4px)}
  .hc.pay{border-color:#f87171;opacity:.75}
  .hc .n{font-weight:800;font-size:10px;line-height:1.15;word-break:break-word}
  .hc .c{color:var(--gold);font-weight:800;font-size:11px}
  .hc .s{color:var(--dim);font-size:8px}

  /* 空地 */
  .clearing{display:flex;gap:5px;overflow-x:auto;min-height:52px;padding:4px 0}
  .cc{
    flex:0 0 auto;width:52px;height:44px;border-radius:8px;border:1px solid #2b5540;
    background:#0a1c13;font-size:8px;display:flex;align-items:center;justify-content:center;
    text-align:center;padding:2px;cursor:pointer;line-height:1.1;
  }
  .cc.pick{border-color:var(--gold)}

  .toast{
    position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(10px);
    background:#16223d;border:1px solid #2b5540;padding:9px 16px;border-radius:10px;
    font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:99;max-width:90vw;text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .banner{background:#3f2d0a;border:1px solid #7a5a12;color:#ffe9a8;border-radius:10px;padding:8px 12px;font-size:13px;text-align:center}
</style>
</head>
<body>
<div class="wrap">

  <div class="card">
    <div class="row between">
      <div>
        <div style="font-weight:800">森林拼图</div>
        <div class="sub">牌堆 <span id="deck">-</span> · 冬卡 <span id="winter">0</span>/3 · <span id="turninfo">-</span></div>
      </div>
      <div style="text-align:right">
        <div style="font-weight:800;color:var(--gold)" id="myscore">0 分</div>
        <div class="sub" id="mycave">洞穴 0</div>
      </div>
    </div>
    <div style="height:8px"></div>
    <div class="opps" id="opps"></div>
  </div>

  <div class="banner hide" id="banner"></div>

  <div class="card">
    <div class="sub" style="margin-bottom:4px">我的森林</div>
    <div class="forest" id="forest"></div>
    <div class="sub hide" id="forest-empty">还没有树，从手牌打一张树牌，或把任意牌背面朝下当树苗</div>
  </div>

  <div class="card">
    <div class="row between" style="margin-bottom:4px">
      <span class="sub">空地（弃牌堆）</span>
      <span class="sub" id="clearing-count">0 张</span>
    </div>
    <div class="clearing" id="clearing"></div>
  </div>

  <div class="card" style="flex:1;display:flex;flex-direction:column">
    <div class="row between" style="margin-bottom:4px">
      <span class="sub">手牌 <span id="hand-count">0</span>/10</span>
      <span class="sub" id="action-hint"></span>
    </div>
    <div class="hand" id="hand"></div>
    <div style="height:6px"></div>
    <div class="row">
      <button class="btn-main" id="btn-draw" style="flex:1">抽两张</button>
      <button class="btn-ghost hide" id="btn-cancel" style="flex:.6">取消</button>
      <button class="btn-main hide" id="btn-confirm" style="flex:1">确认打出</button>
    <button class="btn-ghost hide" id="btn-end" style="flex:.8">结束回合</button>
    </div>
    <div style="height:6px"></div>
    <div class="row" id="mode-row">
      <button class="btn-ghost" id="btn-astree" style="flex:1">当树苗</button>
      <button class="btn-ghost" id="btn-cave" style="flex:1">放洞穴(+1分)</button>
    </div>
  </div>

</div>
<div class="toast" id="toast"></div>

<script src="shared.js"></script>
<script>
(() => {
  const { $, esc, el, toast, on, send, session } = App;

  const S = {
    state: null,
    selCard: null,     // 选中的手牌 uid
    pay: new Set(),    // 支付选中的 uid
    mode: 'play',      // play | astree | cave
    targetSlot: null,  // {treeUid, slot}
    face: 0,           // 双面卡选哪面
    pickClearing: [],  // 抽牌时从空地选的索引
  };

  // 卡牌中文名（常见牌；未收录的显示 id）
  const NAMES = {
    birch:'桦树', beech:'山毛榉', oak:'橡树', douglasFir:'花旗松', linden:'椴树',
    horseChestnut:'七叶树', silverFir:'冷杉', sycamore:'枫树', sapling:'树苗',
    europeanHare:'野兔', europeanBadger:'獾', bechsteinsBat:'鼠耳蝠',
    barbastelleBat:'宽耳蝠', brownLongEaredBat:'长耳蝠', greaterHorseshoeBat:'菊头蝠',
    wolf:'狼', roeDeerBeech:'狍', redDeer:'马鹿', fallowDeer:'黇鹿', squeeker:'野猪崽',
    violetCarpenterBee:'木蜂', beechMarten:'石貂', wildBoar:'野猪', redFox:'赤狐',
    lynx:'猞猁', mole:'鼹鼠', hedgehog:'刺猬', raccoon:'浣熊', brownBear:'棕熊',
    purpleEmperor:'紫闪蝶', peacockButterfly:'孔雀蛱蝶', silverWashedFritillary:'银纹豹蛱蝶',
    camberwellBeauty:'坎伯韦尔蛱蝶', chanterelle:'鸡油菌', flyAgaric:'毒蝇伞',
    parasolMushroom:'大环柄菇', pennyBun:'牛肝菌', treeFrog:'雨蛙', commonToad:'蟾蜍',
    pondTurtle:'池龟', fireSalamander:'火蝾螈', woodAnt:'林蚁', stagBeetle:'锹甲',
    fireFlies:'萤火虫', treeFerns:'树蕨', blackberries:'黑莓', moss:'苔藓',
    wildStrawberries:'野草莓', bullfinch:'红腹灰雀', chaffinch:'苍头燕雀',
    greatSpottedWoodpecker:'大斑啄木鸟', goshawk:'苍鹰', tawnyOwl:'灰林鸮',
    eurasianJay:'松鸦', redSquirrel:'红松鼠', cave:'洞穴', gnat:'蚋',
    commonRaven:'渡鸦', goldenEagle:'金雕', beardedVulture:'胡兀鹫',
    phoebusApollo:'阿波罗绢蝶', Blueberry:'蓝莓', Gentian:'龙胆', Edelweiss:'雪绒花',
    blackTrumpet:'黑喇叭菌', alpineNewt:'高山螈', capercaillie:'松鸡',
    savisPipistrelle:'萨维伏翼', alpineMarmot:'旱獭', mountainHare:'雪兔',
    steinbock:'北山羊', europeanLarch:'欧洲落叶松', stonePine:'瑞士石松',
    europeanBison:'欧洲野牛', nightingale:'夜莺', barnOwl:'仓鸮',
    eurasianMagpie:'喜鹊', mapButterfly:'地图蛱蝶', digitalis:'毛地黄',
    stingingNettle:'荨麻', greatGreenBushCricket:'绿丛螽', waterVole:'水䶄',
    craneFly:'大蚊', beeSwarm:'蜂群', commonPipistrelle:'伏翼',
    europeanPolecat:'林鼬', europeanWildcat:'欧洲野猫', wildBoarFemale:'母野猪',
    squeekerWoodlandEdge:'林地野猪崽', blackthorn:'黑刺李', commonHazel:'榛树',
    elderberry:'接骨木', chamoisDouglasFir:'岩羚羊', chamoisEuropeanLarch:'岩羚羊',
    chamoisStonePine:'岩羚羊',
  };
  const nameOf = id => NAMES[id] || id || '?';

  // ---------- 渲染 ----------
  function render() {
    const st = S.state;
    if (!st) return;

    $('deck').textContent = st.deckLeft;
    $('winter').textContent = st.winterRevealed;
    $('turninfo').textContent = st.currentPlayer === st.you ? '轮到你' : '等对手';
    $('myscore').textContent = (st.score ? st.score.total : 0) + ' 分';
    $('mycave').textContent = '洞穴 ' + (st.cave || 0);

    $('opps').innerHTML = (st.opponents || []).map(o =>
      `<div class="opp">${esc(o.name)} · 手牌 ${o.handCount} · 树 ${o.forest.length} · 洞穴 ${o.cave}</div>`
    ).join('');

    // 森林
    const forest = $('forest');
    forest.innerHTML = '';
    $('forest-empty').classList.toggle('hide', (st.forest || []).length > 0);
    for (const t of st.forest || []) {
      const wrap = el('div', 'tree');
      const mk = (slot) => {
        const s = t.slots[slot];
        const d = el('div', 'slot' + (s ? ' filled' : ''));
        if (s) d.textContent = nameOf(s.faceId);
        else d.textContent = '空';
        if (S.targetSlot && S.targetSlot.treeUid === t.uid && S.targetSlot.slot === slot) {
          d.classList.add('target');
        }
        d.onclick = () => onSlotClick(t.uid, slot, !!s);
        return d;
      };
      wrap.appendChild(el('div'));       // 左上空
      wrap.appendChild(mk('top'));
      wrap.appendChild(el('div'));       // 右上空
      wrap.appendChild(mk('left'));
      const trunk = el('div', 'trunk' + (t.treeId === 'sapling' ? ' sapling' : ''), nameOf(t.treeId));
      wrap.appendChild(trunk);
      wrap.appendChild(mk('right'));
      wrap.appendChild(el('div'));
      wrap.appendChild(mk('bottom'));
      wrap.appendChild(el('div'));
      forest.appendChild(wrap);
    }

    // 空地
    $('clearing-count').textContent = (st.clearing || []).length + ' 张';
    const cl = $('clearing');
    cl.innerHTML = '';
    (st.clearing || []).forEach((c, i) => {
      const d = el('div', 'cc', cardLabel(c.face));
      if (S.pickClearing.includes(i)) d.classList.add('pick');
      d.onclick = () => onClearingClick(i);
      cl.appendChild(d);
    });

    // 手牌
    $('hand-count').textContent = (st.hand || []).length;
    const hd = $('hand');
    hd.innerHTML = '';
    for (const c of st.hand || []) {
      const d = el('div', 'hc ' + (c.kind === 'tree' ? 'tree' : 'split'));
      if (S.selCard === c.uid) d.classList.add('sel');
      if (S.pay.has(c.uid)) d.classList.add('pay');
      const nm = el('div', 'n', cardLabel(c.face));
      const cost = el('div', 'c', '费 ' + costOf(c));
      d.appendChild(nm); d.appendChild(cost);
      if (c.kind === 'split' && c.face && c.face.faces) {
        d.appendChild(el('div', 's', '双面'));
      }
      d.onclick = () => onHandClick(c);
      hd.appendChild(d);
    }

    updateButtons();
  }

  function cardLabel(face) {
    if (!face) return '?';
    if (face.kind === 'winter') return '冬';
    if (face.kind === 'tree') return nameOf(face.id);
    if (face.kind === 'split' && Array.isArray(face.faces)) {
      return face.faces.map(f => nameOf(f.id || f)).join(' / ');
    }
    return '?';
  }

  // 费用由服务端下发（spec.json 的真实值），前端不再自己猜
  function costOf(c) {
    return (c && typeof c.cost === 'number') ? c.cost : 0;
  }

  function updateButtons() {
    const st = S.state;
    const myTurn = st && st.currentPlayer === st.you && st.phase === 'playing';
    $('btn-draw').disabled = !myTurn || (st && st.hand.length >= 10);
    $('btn-draw').classList.toggle('hide', S.mode !== 'play' || S.selCard != null);
    $('btn-confirm').classList.toggle('hide', S.selCard == null);
    $('btn-cancel').classList.toggle('hide', S.selCard == null);
    $('mode-row').classList.toggle('hide', S.selCard == null);

    // 保留回合（水鼠任意树苗 / 鼹鼠付费连打）与免费放置额度：给玩家一个明确的收手按钮
    const pf = st && st.pendingFree;
    const keep = st && st.turnMode;
    const showEnd = myTurn && (pf || keep);
    $('btn-end').classList.toggle('hide', !showEnd);

    let hint;
    if (!myTurn) hint = '等对手行动';
    else if (pf && pf.kind === 'clearing') hint = '从空地选一张牌入手';
    else if (pf && pf.remaining > 1) hint = '可免费放置 ' + pf.remaining + ' 张（点手牌）';
    else if (pf) hint = '免费放置一张（点手牌）';
    else if (keep) hint = '本回合可继续出牌，或点「结束回合」';
    else if (S.selCard) hint = '选支付牌，再点确认';
    else hint = '点手牌出牌，或抽两张';
    $('action-hint').textContent = hint;
  }

  // ---------- 交互 ----------
  /**
   * 手牌点击的唯一入口。
   * 规则：
   *   - 还没选主牌 → 点谁就选谁
   *   - 已选主牌 + 点的是主牌自己 → 取消
   *   - 已选主牌 + 点别的牌 → 切换该牌的「支付」状态（不清空已有选择）
   */
  function onHandClick(c) {
    const st = S.state;
    if (!st || st.currentPlayer !== st.you) return toast('还没轮到你');

    // 免费放置额度生效中：点手牌直接免费落子（不付费、不触发该牌效果）
    const pf = st.pendingFree;
    if (pf && pf.kind === 'typed') {
      const act = { kind: 'play_free', cardUid: c.uid };
      if (c.kind === 'tree') {
        act.asTree = true;                       // 树牌直接立成主植物
      } else {
        // 双面卡需要一个空槽；没有树就先提示
        const tree = (st.forest || []).find(t =>
          ['top', 'bottom', 'left', 'right'].some(s => !t.slots[s]));
        if (!tree) return toast('先种一棵树才能免费挂卡');
        const slot = ['top', 'bottom', 'left', 'right'].find(s => !tree.slots[s]);
        act.treeUid = tree.uid; act.slot = slot; act.face = 0;
      }
      send({ type: 'action', action: act });
      S.selCard = null; S.pay.clear(); S.targetSlot = null;
      return;
    }

    if (S.selCard === c.uid) {
      // 点主牌自己 → 取消整个出牌
      S.selCard = null; S.pay.clear(); S.targetSlot = null;
      return render();
    }

    if (S.selCard == null) {
      // 第一次点：选为主牌
      S.selCard = c.uid;
      S.pay.clear();
      S.targetSlot = null;
      S.face = 0;
      return render();
    }

    // 已有主牌：这一下是加/减支付
    if (S.pay.has(c.uid)) S.pay.delete(c.uid);
    else S.pay.add(c.uid);
    render();
  }

  function onSlotClick(treeUid, slot, filled) {
    if (!S.selCard) return;
    if (filled) return toast('这个槽位已被占');
    S.targetSlot = { treeUid, slot };
    render();
  }

  function onClearingClick(i) {
    const st = S.state;
    // 空地取牌额度（LichtungHandTyp）：点哪张取哪张
    if (st && st.pendingFree && st.pendingFree.kind === 'clearing') {
      const c = (st.clearing || [])[i];
      if (!c) return;
      send({ type: 'action', action: { kind: 'take_clearing', uid: c.uid } });
      return;
    }
    // 抽牌模式下选空地；否则忽略
    if (S.selCard) return;
    const idx = S.pickClearing.indexOf(i);
    if (idx >= 0) S.pickClearing.splice(idx, 1);
    else if (S.pickClearing.length < 2) S.pickClearing.push(i);
    render();
  }

  $('btn-draw').onclick = () => {
    const picks = S.pickClearing.map(i => ({ from: 'clearing', index: i }));
    while (picks.length < 2) picks.push({ from: 'deck' });
    send({ type: 'action', action: { kind: 'draw', picks } });
    S.pickClearing = [];
  };

  $('btn-end').onclick = () => {
    // 保留回合模式下手动收手：放弃剩余免费额度与连打机会
    S.selCard = null; S.pay.clear(); S.targetSlot = null;
    send({ type: 'action', action: { kind: 'endTurn' } });
  };

  $('btn-cancel').onclick = () => {
    S.selCard = null; S.pay.clear(); S.targetSlot = null; S.mode = 'play';
    render();
  };

  $('btn-astree').onclick = () => {
    if (!S.selCard) return;
    send({ type: 'action', action: { kind: 'play', cardUid: S.selCard, pay: [], asTree: true } });
    S.selCard = null; S.pay.clear();
  };

  $('btn-cave').onclick = () => {
    if (!S.selCard) return;
    send({ type: 'action', action: { kind: 'play', cardUid: S.selCard, pay: [], cave: true } });
    S.selCard = null; S.pay.clear();
  };

  $('btn-confirm').onclick = () => {
    const st = S.state;
    const card = (st.hand || []).find(c => c.uid === S.selCard);
    if (!card) return;

    const act = { kind: 'play', cardUid: S.selCard, pay: [...S.pay] };

    if (card.kind === 'split') {
      if (!S.targetSlot) return toast('先点一个空的树槽');
      act.face = S.face;
      act.treeUid = S.targetSlot.treeUid;
      act.slot = S.targetSlot.slot;
    }

    send({ type: 'action', action: act });
    S.selCard = null; S.pay.clear(); S.targetSlot = null;
  };

  // ---------- 消息 ----------
  on('state', m => {
    if (m.game !== 'forest') return;
    S.state = m;
    if (m.ended) {
      $('banner').classList.remove('hide');
      $('banner').textContent = '冬天来了，本局结束';
    }
    render();
  });

  // 调试出口：便于自动化测试读取内部状态（不影响正常玩法）
  window.__S = S;
  window.__dbg = () => ({
    selCard: S.selCard,
    pay: [...S.pay],
    hand: (S.state ? S.state.hand : []).map(c => ({ uid: c.uid, kind: c.kind })),
  });

  on('gameover', m => {
    if (m.game !== 'forest') return;
    const lines = (m.ranking || []).map(r =>
      `${r.rank}. ${esc(r.name)} — ${r.score} 分`).join('\n');
    alert('对局结束\n\n' + lines);
  });

  // 进入本页时确保会话已连接
  App.loadSession();
  if (!App.socket && session.code) {
    App.connect().then(() => {
      send({ type: 'hello', name: session.name, pid: session.pid, room: session.code });
    }).catch(() => {});
  }

  // 房间信息用于判断游戏类型
  on('room', m => {
    if (m.game === 'forest' && m.phase === 'playing') render();
  });
})();
</script>
</body>
