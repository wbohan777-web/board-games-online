services:
  - type: web
    name: board-games-online
    env: node
    plan: starter
    buildCommand: "echo '✅ 零依赖，无需构建'"
    startCommand: "node server.js"
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
    autoDeploy: true