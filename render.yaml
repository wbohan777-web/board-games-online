services:
  - type: web
    name: tabletop-duo
    runtime: node
    plan: starter
    buildCommand: "echo no build step required"
    startCommand: "node server.js"
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PORT
        value: "10000"
    autoDeploy: true